<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Smart Mailbox Co. for questions, orders, or support." />
  <title>Smart Mailbox Co. | Contact</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Smart Mailbox Co.</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Products or Services</a>
        <a href="about.html">About</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <section class="section-block">
      <h1>Contact</h1>
      <p class="lead">Send us a message and we will respond as soon as possible.</p>
    </section>

    <form id="contactForm" class="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" required placeholder="Your name" />

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />

      <label for="message">Message</label>
      <textarea id="message" rows="5" required placeholder="Tell us what you need"></textarea>

      <button class="btn btn-primary" type="submit">Send Message</button>
      <p id="error" class="form-message" aria-live="polite"></p>
    </form>
  </main>

  <script src="js/form.js"></script>
</body>
</html>
